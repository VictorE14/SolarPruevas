<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRODE Solar - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-page">
        <div class="login-container">
            <div class="login-box">
                <div class="login-logo">
                    <i class="fas fa-sun" style="color: #f59e0b;"></i>
                    <h1>CRODE Solar</h1>
                    <p>Plataforma de Monitoreo</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="admin@crode.mx" value="admin@crode.mx">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="admin123">
                    </div>
                    <div id="loginError" class="login-error" style="display:none;"></div>
                    <button type="submit" class="btn-primary login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>

                <div class="login-footer">
                    <p style="font-size:13px; color:var(--text-secondary);">Sistema de monitoreo de inversores fotovoltaicos</p>
                    <p style="font-size:12px; color:var(--text-secondary);">TecNM CRODE Mérida</p>
                    <p style="font-size:11px; color:var(--text-secondary); margin-top:6px;">
                        <strong>Usuarios de prueba:</strong><br>
                        admin@crode.mx / admin123 (Administrador)<br>
                        juan@crode.mx / juan123 (Técnico)<br>
                        pedro@crode.mx / pedro123 (Técnico)
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="shared/supabase.js"></script>
    <script>
        // ============================================================
        //  LOGIN ÚNICO - REDIRECCIÓN POR ROL
        // ============================================================

        const db = window.db;

        // Verificar si ya hay sesión activa
        function checkSession() {
            const user = localStorage.getItem('usuarioActual');
            if (user) {
                try {
                    const usuario = JSON.parse(user);
                    redirectByRole(usuario);
                } catch (e) {
                    localStorage.removeItem('usuarioActual');
                }
            }
        }

        // Redirigir según el rol
        function redirectByRole(usuario) {
            if (usuario.rol === 'admin') {
                window.location.href = 'admin.html';
            } else if (usuario.rol === 'tecnico' || usuario.rol === 'invitado') {
                window.location.href = 'monitor.html';
            } else {
                window.location.href = 'monitor.html';
            }
        }

        // Función de login
        async function login(email, password) {
            try {
                const usuario = await db.getUsuarioByEmail(email);
                
                if (!usuario) {
                    return { success: false, message: 'Usuario no encontrado' };
                }
                
                if (usuario.password_hash !== password) {
                    return { success: false, message: 'Contraseña incorrecta' };
                }
                
                if (usuario.estado === 'inactivo') {
                    return { success: false, message: 'Usuario inactivo. Contacta al administrador.' };
                }
                
                // Guardar sesión
                localStorage.setItem('usuarioActual', JSON.stringify(usuario));
                
                // Registrar log
                await db.registrarLog(usuario.id, usuario.nombre, 'Inicio de sesión', 'Desde login único');
                await db.updateUltimoAcceso(usuario.id);
                
                return { success: true, usuario };
                
            } catch (error) {
                console.error('❌ Error en login:', error);
                return { success: false, message: 'Error de conexión' };
            }
        }

        // ============================================================
        //  EVENTO DEL FORMULARIO
        // ============================================================

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                errorDiv.textContent = 'Por favor, completa todos los campos.';
                errorDiv.style.display = 'block';
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando...';
            errorDiv.style.display = 'none';
            
            const result = await login(email, password);
            
            if (result.success) {
                redirectByRole(result.usuario);
            } else {
                errorDiv.textContent = result.message;
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
            }
        });

        // ============================================================
        //  VERIFICAR SESIÓN AL CARGAR
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
        });

        console.log('✅ Login único cargado correctamente');
    </script>

</body>
</html>
