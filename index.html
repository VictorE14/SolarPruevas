<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRODE Solar - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container { width: 100%; max-width: 420px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .login-box {
            background: white;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo i { font-size: 48px; color: #f59e0b; margin-bottom: 8px; }
        .login-logo h1 { font-size: 28px; font-weight: 700; color: #0f172a; }
        .login-logo p { color: #64748b; font-size: 14px; }
        .login-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-weight: 500; font-size: 14px; color: #64748b; }
        .form-control {
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .form-control::placeholder { color: #94a3b8; font-size: 14px; }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .login-btn:hover { background: #2563eb; transform: scale(1.02); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .login-error {
            background: #fef2f2;
            color: #ef4444;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            border: 1px solid #fecaca;
            display: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
            color: #64748b;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <i class="fas fa-sun"></i>
                <h1>CRODE Solar</h1>
                <p>Plataforma de Monitoreo</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="admin@crode.mx">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
                </div>
                <div id="loginError" class="login-error"></div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <p>Sistema de monitoreo de inversores fotovoltaicos</p>
                <p style="font-size:12px; color:#64748b;">TecNM CRODE Mérida</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="shared/supabase.js"></script>
    <script>
        const db = window.db;

        function checkSession() {
            const user = localStorage.getItem('usuarioActual');
            if (user) {
                try {
                    const usuario = JSON.parse(user);
                    if (usuario.rol === 'admin') {
                        window.location.href = 'admin/admin.html';
                    } else {
                        window.location.href = 'monitor.html';
                    }
                } catch (e) {
                    localStorage.removeItem('usuarioActual');
                }
            }
        }

        async function login(email, password) {
            try {
                const usuario = await db.getUsuarioByEmail(email);
                if (!usuario) return { success: false, message: 'Usuario no encontrado' };
                if (usuario.password_hash !== password) return { success: false, message: 'Contraseña incorrecta' };
                if (usuario.estado === 'inactivo') return { success: false, message: 'Usuario inactivo' };
                
                localStorage.setItem('usuarioActual', JSON.stringify(usuario));
                await db.registrarLog(usuario.id, usuario.nombre, 'Inicio de sesión', 'Desde login único');
                await db.updateUltimoAcceso(usuario.id);
                
                return { success: true, usuario };
            } catch (error) {
                console.error('❌ Error en login:', error);
                return { success: false, message: 'Error de conexión' };
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                errorDiv.textContent = 'Completa todos los campos.';
                errorDiv.style.display = 'block';
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Iniciando...';
            errorDiv.style.display = 'none';
            
            const result = await login(email, password);
            
            if (result.success) {
                if (result.usuario.rol === 'admin') {
                    window.location.href = 'admin/admin.html';
                } else {
                    window.location.href = 'monitor.html';
                }
            } else {
                errorDiv.textContent = result.message;
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
            }
        });

        document.addEventListener('DOMContentLoaded', checkSession);
        console.log('✅ Login único cargado');
    </script>

</body>
</html>
